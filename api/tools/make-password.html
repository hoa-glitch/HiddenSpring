<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make a board login</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1F2B2A; background: #F3F5F1; }
  label { display: block; font-weight: 600; margin-top: 1rem; }
  input { width: 100%; padding: .6rem; font: inherit; box-sizing: border-box; border: 1px solid #AEB9B1; border-radius: 4px; }
  button { margin-top: 1.25rem; padding: .7rem 1.2rem; font: 600 16px system-ui; background: #2E5A4C; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  textarea { width: 100%; height: 6rem; font: 13px ui-monospace, monospace; margin-top: .5rem; box-sizing: border-box; }
  .note { color: #52605D; font-size: 14px; }
  .err { color: #A63D32; }
</style>
</head>
<body>
  <h1>Make a board login</h1>
  <p class="note">This page runs only on your computer. Nothing you type is sent anywhere.
  It turns a username and password into a scrambled line (a hash) for the Lambda's <code>ADMIN_USERS</code> setting.</p>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" autocomplete="off" required pattern="[A-Za-z0-9._-]+" placeholder="e.g. jane">
    <label for="p">Password (at least 12 characters)</label>
    <input id="p" type="password" autocomplete="new-password" required minlength="12">
    <label for="p2">Type the password again</label>
    <input id="p2" type="password" autocomplete="new-password" required minlength="12">
    <button type="submit">Make login line</button>
  </form>
  <p id="msg"></p>
  <div id="out" hidden>
    <label for="line">Copy this line into ADMIN_USERS</label>
    <textarea id="line" readonly></textarea>
    <p class="note">For more than one board member, join their lines with a comma and no spaces.</p>
  </div>
<script>
const ITERATIONS = 600000;
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const user = document.getElementById('u').value.trim().toLowerCase();
  const pass = document.getElementById('p').value;
  if (pass !== document.getElementById('p2').value) { msg.className = 'err'; msg.textContent = "The passwords don't match."; return; }
  if (!window.crypto?.subtle) { msg.className = 'err'; msg.textContent = 'This browser blocks the tool on local files. Try Chrome, or use make-password.mjs.'; return; }
  msg.className = ''; msg.textContent = 'Working…';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITERATIONS }, key, 256);
  document.getElementById('line').value = `${user}:${ITERATIONS}:${hex(salt)}:${hex(bits)}`;
  document.getElementById('out').hidden = false;
  document.getElementById('p').value = document.getElementById('p2').value = '';
  msg.textContent = 'Done. Give the board member their password privately.';
});
</script>
</body>
</html>
